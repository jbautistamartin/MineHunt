<div
  class="tablero"
  [style.grid-template-columns]="columnas()"
  [class.bloqueado]="bloqueado()"
  (contextmenu)="$event.preventDefault()"
>
  @for (fila of filas(); track $index) {
    @for (celda of fila; track clave($index, celda)) {
      <button
        type="button"
        class="celda"
        [ngClass]="clasesDe(celda)"
        [disabled]="bloqueado() || celda.estado !== 'oculta'"
        (click)="pulsar(celda)"
        (contextmenu)="pulsarAlterna($event, celda)"
      >
        @if (celda.estado === 'mina-encontrada' || celda.estado === 'mina-sin-encontrar') {
          <span class="glifo" aria-hidden="true">✸</span>
        } @else {
          {{ textoDe(celda) }}
        }
      </button>
    }
  }
</div>
