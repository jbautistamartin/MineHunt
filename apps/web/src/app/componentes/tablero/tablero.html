<div class="tablero" [style.grid-template-columns]="columnas()" [class.bloqueado]="bloqueado()">
  @for (fila of filas(); track $index) {
    @for (celda of fila; track clave($index, celda)) {
      <button
        type="button"
        class="celda"
        [ngClass]="clasesDe(celda)"
        [disabled]="bloqueado() || celda.estado !== 'oculta'"
        (click)="pulsar(celda)"
      >
        @if (celda.estado === 'mina-encontrada') {
          <span class="glifo" aria-hidden="true">✸</span>
        } @else {
          {{ textoDe(celda) }}
        }
      </button>
    }
  }
</div>
