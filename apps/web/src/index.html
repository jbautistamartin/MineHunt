<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>MineHunt</title>
  <base href="/">
  <!-- viewport-fit=cover deja que la app llegue al borde en moviles con muesca;
       el hueco de la muesca lo respeta el padding de body con env(safe-area-*). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- El icono maestro vive en documentos/MineHunt-icon.svg; esta es su copia servible. -->
  <link rel="icon" type="image/svg+xml" href="icono.svg">
  <link rel="apple-touch-icon" href="icono-192.png">
  <!-- Hay un manifiesto por idioma, porque el nombre y la descripcion con los
       que se instala la aplicacion tambien se traducen. Este es el de reserva
       (el mismo idioma que el fallbackLang) y ServicioIdioma lo cambia en
       cuanto sabe en que idioma va la interfaz. -->
  <link id="manifiesto" rel="manifest" href="manifest.en.json">
  <meta name="theme-color" content="#0d1730">
</head>
<body>
  <app-root></app-root>
</body>
</html>
